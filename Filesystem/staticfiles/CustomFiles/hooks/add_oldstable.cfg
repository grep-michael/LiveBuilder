#!/bin/bash
set -e

# Add oldstable (bookworm) repository
echo "deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware" > /etc/apt/sources.list.d/oldstable.list

# Create apt pinning to prefer trixie but allow oldstable
cat << 'PINEOF' > /etc/apt/preferences.d/oldstable
Package: *
Pin: release n=trixie
Pin-Priority: 900

Package: *
Pin: release n=bookworm
Pin-Priority: 100

Package: dmraid
Pin: release n=bookworm
Pin-Priority: 500
PINEOF

# Update apt cache
apt-get update
