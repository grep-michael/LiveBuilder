#!/bin/bash
#
# Auto Resolution Setter for Debian Live System
# Sets monitor resolution to 1920x1080 on auto-login
#

LOG_FILE="/var/log/resolution_setter.log"
TARGET_RESOLUTION="1920x1080"

# Function to log messages
log_message() {
    echo "$(date '+%Y-%m-%d %H:%M:%S') - $1" | tee -a "$LOG_FILE"
}

# Wait for X display to be available and stable
wait_for_display() {
    local max_attempts=30
    local attempt=1
    
    log_message "INFO - Waiting for display server to become available..."
    
    while [ $attempt -le $max_attempts ]; do
        if xrandr --query &>/dev/null && xset q &>/dev/null; then
            log_message "INFO - Display server is ready"
            # Additional wait for input subsystem to stabilize
            sleep 2
            return 0
        fi
        
        log_message "INFO - Waiting for display server... ($attempt/$max_attempts)"
        sleep 1
        ((attempt++))
    done
    
    log_message "ERROR - Display server not available after 30 seconds"
    return 1
}

# Get the primary connected display
get_primary_display() {
    # First try to find a connected primary display
    local display=$(xrandr --query | grep " connected primary" | head -n1 | awk '{print $1}')
    
    # If no connected primary found, get any connected display
    if [ -z "$display" ]; then
        display=$(xrandr --query | grep " connected" | grep -v "disconnected" | head -n1 | awk '{print $1}')
    fi
    
    if [ -n "$display" ]; then
        echo "$display"
        return 0
    else
        return 1
    fi
}

# Check if resolution is supported
check_resolution_support() {
    local display="$1"
    local resolution="$2"
    
    if xrandr --query | grep -A 20 "^$display" | grep -q "$resolution"; then
        log_message "INFO - Resolution $resolution is supported on $display"
        return 0
    else
        log_message "WARNING - Resolution $resolution is not natively supported on $display"
        return 1
    fi
}

# Add custom resolution mode if not available
add_custom_resolution() {
    local display="$1"
    local resolution="$2"
    
    log_message "INFO - Attempting to add custom resolution $resolution"
    
    # Generate modeline for the resolution
    local modeline=$(cvt 1920 1080 60 | grep "Modeline" | sed 's/Modeline //')
    local mode_name=$(echo "$modeline" | awk '{print $1}' | tr -d '"')
    local mode_params=$(echo "$modeline" | cut -d' ' -f2-)
    
    # Add the new mode
    if xrandr --newmode $mode_name $mode_params 2>/dev/null; then
        log_message "INFO - Created new mode: $mode_name"
        
        # Add mode to display
        if xrandr --addmode "$display" "$mode_name" 2>/dev/null; then
            log_message "INFO - Added mode $mode_name to $display"
            echo "$mode_name"
            return 0
        else
            log_message "ERROR - Failed to add mode to display"
        fi
    else
        log_message "ERROR - Failed to create new mode"
    fi
    
    return 1
}

# Set the resolution safely
set_resolution() {
    local display="$1"
    local resolution="$2"
    
    log_message "INFO - Setting resolution to $resolution on $display"
    log_message "DEBUG - Display variable contains: '$display'"
    log_message "DEBUG - Resolution variable contains: '$resolution'"
    log_message "DEBUG - Full command will be: xrandr --output \"$display\" --mode \"$resolution\" --primary --auto"
    
    # Use --primary and preserve other settings to avoid input issues
    if xrandr --output "$display" --mode "$resolution" --primary --auto 2>/dev/null; then
        log_message "INFO - Successfully set resolution to $resolution"
        # Small delay to let X11 settle
        sleep 1
        return 0
    else
        log_message "ERROR - Failed to set resolution to $resolution"
        log_message "DEBUG - xrandr error output:"
        xrandr --output "$display" --mode "$resolution" --primary --auto 2>&1 | while read line; do
            log_message "DEBUG - $line"
        done
        return 1
    fi
}

# Main execution
main() {
    log_message "INFO - Starting resolution setter script"
    
    # Ensure we have a DISPLAY environment variable
    if [ -z "$DISPLAY" ]; then
        export DISPLAY=:0
        log_message "INFO - Set DISPLAY environment variable to :0"
    fi
    
    # Wait for display server
    if ! wait_for_display; then
        log_message "ERROR - Display server not available, exiting"
        exit 1
    fi
    
    # Get primary display
    primary_display=$(get_primary_display)
    if [ $? -ne 0 ] || [ -z "$primary_display" ]; then
        log_message "ERROR - Could not find primary display, exiting"
        log_message "DEBUG - Available displays:"
        xrandr --query | grep -E "(connected|disconnected)" | while read line; do
            log_message "DEBUG - $line"
        done
        exit 1
    fi
    
    # Check current resolution
    current_resolution=$(xrandr --query | grep -A 1 "^$primary_display" | grep "\*" | awk '{print $1}')
    log_message "INFO - Current resolution: $current_resolution"
    
    if [ "$current_resolution" = "$TARGET_RESOLUTION" ]; then
        log_message "INFO - Resolution already set to $TARGET_RESOLUTION"
        exit 0
    fi
    
    # Check if target resolution is supported
    if check_resolution_support "$primary_display" "$TARGET_RESOLUTION"; then
        # Resolution is supported, set it directly
        if set_resolution "$primary_display" "$TARGET_RESOLUTION"; then
            log_message "INFO - Resolution change completed successfully"
        else
            log_message "ERROR - Failed to change resolution"
            exit 1
        fi
    else
        # Try to add custom resolution
        if custom_mode=$(add_custom_resolution "$primary_display" "$TARGET_RESOLUTION"); then
            if set_resolution "$primary_display" "$custom_mode"; then
                log_message "INFO - Custom resolution set successfully"
            else
                log_message "ERROR - Failed to set custom resolution"
                exit 1
            fi
        else
            log_message "ERROR - Could not create or set custom resolution"
            exit 1
        fi
    fi
    
    # Final input verification and cleanup
    log_message "INFO - Performing final input verification"
    local final_input_count=$(xinput list --short 2>/dev/null | wc -l)
    if [ "$final_input_count" -lt 3 ]; then
        log_message "WARNING - Low input device count detected, performing additional input reload"
        reload_input_system
    fi
    
    # Verify the change
    new_resolution=$(xrandr --query | grep -A 1 "^$primary_display" | grep "\*" | awk '{print $1}')
    log_message "INFO - New resolution: $new_resolution"
    
    log_message "INFO - Resolution setter script completed"
}

# Run main function
main "$@"